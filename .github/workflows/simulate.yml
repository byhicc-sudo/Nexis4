name: NEXIS-4 SPICE simulation
on:
  workflow_dispatch:
  push:
    paths:
      - 'spice/**'
      - 'tests/**'
      - '.github/workflows/simulate.yml'
jobs:
  spice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Verify simulator
        run: ngspice --version
      - name: Run M26 electrical test
        run: |
          cd spice
          ngspice -b levels.cir > simulation.log 2>&1
          cat simulation.log
          test -s voltage_trace.txt
      - name: Run M27 four-level decoder
        run: |
          ngspice -b spice/m27_decoder.cir > spice/m27_decoder.log 2>&1
          cat spice/m27_decoder.log
          set -o pipefail
          python3 tests/check_m27.py spice/m27_decoder.log | tee spice/m27_validation.txt
      - name: Run M28 MOS threshold sensors
        run: |
          ngspice -b spice/m28_mos_sensor.cir > spice/m28_mos_sensor.log 2>&1
          cat spice/m28_mos_sensor.log
          set -o pipefail
          python3 tests/check_m28.py spice/m28_mos_sensor.log | tee spice/m28_validation.txt
      - name: Run M29 switching delay and power benchmark
        run: |
          ngspice -b spice/m29_timing.cir > spice/m29_timing.log 2>&1
          cat spice/m29_timing.log
          set -o pipefail
          python3 tests/check_m29.py spice/m29_timing.log | tee spice/m29_validation.txt
          test -s spice/m29_metrics.json
          test -s spice/m29_validation.txt
      - name: Run M30 binary CMOS reference
        run: |
          set -o pipefail
          ngspice -b spice/m30_binary_reference.cir > spice/m30_binary_reference.log 2>&1
          cat spice/m30_binary_reference.log
          python3 tests/check_m30.py spice/m30_binary_reference.log | tee spice/m30_validation.txt
          test -s spice/m30_binary_metrics.json
      - name: Upload traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexis4-spice-results
          path: |
            spice/simulation.log
            spice/voltage_trace.txt
            spice/m27_decoder.log
            spice/m27_validation.txt
            spice/m28_mos_sensor.log
            spice/m28_validation.txt
            spice/m29_timing.log
            spice/m29_validation.txt
            spice/m29_metrics.json
            spice/m30_binary_reference.log
            spice/m30_validation.txt
            spice/m30_binary_metrics.json
          if-no-files-found: warn
